name: FormatCheck
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  format-check:
    uses: "SciML/.github/.github/workflows/runic.yml@v1"
    secrets: "inherit"
